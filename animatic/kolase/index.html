<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>Kok Bisa? #01 – kolase</title>
<style>
:root{--paper:#f3e9d2;--ink:#3a2312;--honey:#f0a500;--honey2:#c77d00;--teal:#2a7f86;--coral:#e2552d;--lemon:#f4d03f;--plum:#6b3fa0;--water:#6fb7e9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:var(--paper)}
body{font-family:'Inter','Liberation Sans',sans-serif;color:var(--ink);position:relative}
/* kertas: grain + halftone */
#bg{position:absolute;inset:0;background:
 radial-gradient(circle at 1px 1px,#3a231214 1.2px,transparent 1.6px) 0 0/14px 14px,var(--paper)}
#grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.scene{position:absolute;inset:0;display:none}
.sh{filter:drop-shadow(3px 5px 0 rgba(58,35,18,.22))}
/* kepala */
.badge{position:absolute;top:34px;left:34px;background:var(--ink);color:var(--paper);font-weight:900;font-size:26px;padding:8px 18px;transform:rotate(-2deg);z-index:20;letter-spacing:.5px}
.tape{position:absolute;width:90px;height:28px;background:#e8d8a888;transform:rotate(-8deg)}
.hl{position:absolute;top:112px;left:30px;right:30px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10}
.lab{display:inline-block;font-weight:900;font-size:62px;line-height:1.04;padding:8px 22px 10px;text-transform:uppercase;letter-spacing:-1px;
 clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 94%,96% 100%,2% 96%,0 100%);animation:labin .5s cubic-bezier(.2,1.5,.4,1) both}
.lab.h{background:var(--honey);color:var(--ink)}.lab.k{background:var(--ink);color:var(--paper)}.lab.c{background:var(--coral);color:var(--paper)}.lab.t{background:var(--teal);color:var(--paper)}.lab.p{background:var(--plum);color:var(--paper)}
.lab.s{font-size:48px}
@keyframes labin{from{transform:translateY(-60px) scale(.6) rotate(var(--r,-2deg));opacity:0}60%{opacity:1}to{transform:rotate(var(--r,-2deg))}}
/* panggung */
.stage{position:absolute;left:0;top:360px;width:720px;height:580px}
.abs{position:absolute}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(var(--r,0deg))}}
.fade{animation:fade .5s ease var(--d,0s) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slam{animation:slam .45s cubic-bezier(.2,1.2,.3,1) var(--d,0s) both}
@keyframes slam{from{transform:translateY(-500px) rotate(-8deg)}70%{transform:translateY(8px) rotate(1deg)}to{transform:translateY(0) rotate(var(--r,0deg))}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.shake{animation:shake .35s linear infinite}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-5px 2px}75%{translate:5px -2px}}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{position:absolute;background:var(--paper);border:3px solid var(--ink);font-weight:800;font-size:26px;padding:6px 14px;box-shadow:4px 5px 0 var(--ink)}
/* subtitle */
.sub{position:absolute;left:28px;right:28px;top:966px;background:#fbf5e6;padding:24px 26px 28px;transform:rotate(-.8deg);
 box-shadow:5px 7px 0 rgba(58,35,18,.28);clip-path:polygon(0 3%,4% 0,50% 2%,96% 0,100% 3%,99% 97%,60% 100%,10% 98%,0 100%);z-index:30;
 font-weight:800;font-size:37px;line-height:1.3;min-height:190px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 10px}
.sub span{color:rgba(58,35,18,.28);animation:w .01s linear var(--wd) both}
@keyframes w{to{color:#3a2312}}
.sub:before{content:"";position:absolute;top:-6px;left:40%;width:90px;height:24px;background:#e8d8a8aa;transform:rotate(3deg)}
/* progres */
#prog{position:absolute;left:0;bottom:0;height:16px;background:var(--ink);z-index:40}
#time{position:absolute;left:34px;bottom:34px;font-weight:800;font-size:22px;color:#3a231299;z-index:40}
#mark{position:absolute;right:34px;bottom:34px;font-weight:800;font-size:22px;color:#3a231299;z-index:40}
</style></head><body>
<div id="bg"></div>
<svg id="grain" width="720" height="1280"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .9 0"/></filter><rect width="720" height="1280" filter="url(#n)"/></svg>
<div class="badge sh">#01 KOK BISA?</div>
<div id="root"></div>
<div id="time">0:00</div><div id="mark">KOLASE – VERSI GRATIS</div><div id="prog"></div>

<script>
/* ---------- bahan ilustrasi (vektor buatan tangan) ---------- */

<path d="M12 46 q-14 -10 -10 -22 M12 52 q-14 12 -8 24" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="14" y="14" width="124" height="66" rx="33" fill="${c}"/>
<g fill="#fff" opacity=".35"><circle cx="48" cy="38" r="6"/><circle cx="80" cy="56" r="5"/><circle cx="104" cy="34" r="7"/><circle cx="64" cy="30" r="3"/><circle cx="116" cy="58" r="4"/></g>
<circle cx="104" cy="46" r="0" fill="#fff"/></g></svg>`;

const jar=()=>`<svg class="sh" width="360" height="430" viewBox="0 0 300 360"><path d="M64 96 Q38 130 44 226 Q50 332 150 338 Q250 332 256 226 Q262 130 236 96Z" fill="#a8613a"/>
<path d="M78 130 Q62 160 66 230 Q72 318 150 322 Q228 318 234 230 Q238 160 222 130Z" fill="#f0a500"/><path d="M92 150 q-10 50 -4 90" stroke="#ffd36a" stroke-width="12" fill="none" stroke-linecap="round"/>
<rect x="74" y="72" width="152" height="34" rx="8" fill="#8a4b2a"/><path d="M46 150 l18 -10 l-6 18 l14 -4" stroke="#3a2312" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M254 280 l-18 10 l8 14" stroke="#3a2312" stroke-width="5" fill="none"/>
<rect x="96" y="205" width="110" height="52" fill="#f3e9d2" transform="rotate(-4 150 230)"/><text x="151" y="240" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="#3a2312" transform="rotate(-4 150 230)">±3.000 th</text></svg>`;

<ellipse cx="88" cy="78" rx="62" ry="38" fill="#f0a500"/><path d="M62 42 q-14 36 0 72 M92 40 q-12 38 0 76 M120 46 q-10 32 0 66" stroke="#3a2312" stroke-width="12" fill="none"/>
<circle cx="146" cy="72" r="20" fill="#3a2312"/><circle cx="152" cy="66" r="5" fill="#fff"/><path d="M28 80 l-22 4 l22 8Z" fill="#3a2312"/><path d="M142 54 q8 -22 22 -26" stroke="#3a2312" stroke-width="4" fill="none"/></svg>`;

const bowl=()=>`<svg class="sh" width="340" height="240" viewBox="0 0 340 240"><path d="M20 100 h300 a150 130 0 0 1 -150 120 a150 130 0 0 1 -150 -120Z" fill="#e9e2d0"/><path d="M20 100 h300" stroke="#3a2312" stroke-width="4"/><path d="M40 100 q20 -50 70 -46 q40 -26 80 -4 q48 -10 70 36 q20 6 12 14 H40Z" fill="#fff"/><g class="mold" fill="#6a8f3a"><circle cx="120" cy="78" r="10"/><circle cx="190" cy="64" r="13"/><circle cx="244" cy="82" r="9"/><circle cx="160" cy="86" r="7"/></g><path d="M90 215 h160" stroke="#3a2312" stroke-width="10" stroke-linecap="round"/></svg>`;

const cell=(n,c,t,sub)=>`<div class="abs sh" style="width:170px;height:170px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff6e0;font-weight:900"><div style="font-size:86px;line-height:1">${n}</div><div style="font-size:24px;margin-top:2px">${t}</div></div>`;

{d:3,vo:'Madu ini umurnya ribuan tahun. Dan belum basi. Kok bisa?',head:L('h','Madu 3.000 tahun.',-2,0)+L('k','Belum basi.',1.5,.5),

{d:7,vo:'Jebakan pertama: air. Kuman butuh air buat hidup.',head:L('t','1. Air',-2,0),
 stage:`<div class="abs fade" style="left:150px;top:40px;--d:.4s"><div style="width:420px;height:420px;border-radius:50%;background:#6fb7e955;border:6px solid #6fb7e9"></div></div>
 <div class="abs pop" style="left:240px;top:200px;--d:.9s"><div class="bob">${bact('#2a7f86',240)}</div></div>
 <div class="abs bob" style="left:80px;top:60px">${drop(70)}</div><div class="abs bob" style="left:570px;top:110px;animation-delay:-1s">${drop(60)}</div><div class="abs bob" style="left:520px;top:400px;animation-delay:-.5s">${drop(50)}</div>
 <div class="tag pop" style="left:200px;top:480px;--d:2.2s;--r:-2deg">kuman butuh air ↑</div>`},
{d:10,vo:'Madu cuma sekitar seperlimanya air, sisanya gula pekat. Gula menyedot air dari bakteri. Bakteri masuk, langsung kering. Tapi itu belum cukup.',head:L('h','Gula menyedot air',-1.5,0),
 stage:`<div class="abs fade" style="left:40px;top:10px;width:640px;--d:.4s"><div style="display:flex;height:54px;border:4px solid #3a2312;background:#f3e9d2"><div id="bw" style="width:0;background:#6fb7e9;animation:grow 1s ease 1s both;--w:21%"></div><div style="flex:1;background:#f0a500;animation:grow2 1s ease 1s both"></div></div>
 <div style="display:flex;justify-content:space-between;font-weight:900;font-size:24px;margin-top:6px"><span>air ±17%</span><span>gula ±80%</span></div></div>
 <div class="abs" style="left:20px;top:380px;width:680px;height:190px;background:#f0a500;border-radius:24px;box-shadow:4px 6px 0 #c77d00" ><div style="position:absolute;inset:0;background:radial-gradient(circle at 6px 6px,#fff6 3px,transparent 4px) 0 0/34px 34px"></div></div>
 <div class="abs shr" style="left:60px;top:200px">${bact('#2a7f86',180)}</div>
 <div class="abs flow" style="left:210px;top:210px;--d:1.8s">${drop(44)}</div><div class="abs flow" style="left:200px;top:210px;--d:3s">${drop(44)}</div><div class="abs flow" style="left:220px;top:210px;--d:4.2s">${drop(44)}</div><div class="abs flow" style="left:205px;top:210px;--d:5.4s">${drop(44)}</div>
 <div class="tag pop" style="left:420px;top:240px;--d:5.5s;--r:3deg">langsung kering</div>`,css:`
 @keyframes grow{from{width:0}to{width:var(--w,21%)}} @keyframes grow2{from{flex:0}to{flex:1}}
 .shr{animation:shr 5s ease 2s both}@keyframes shr{to{transform:scale(.55) translateY(40px);filter:grayscale(1) sepia(.4)}}
 .flow{animation:flow 1.5s ease-in var(--d) both}@keyframes flow{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(200px,200px) scale(.4)}}`},
{d:8,vo:'Jebakan kedua: keasaman. pH madu sekitar tiga sampai empat, mirip jus jeruk.',head:L('k','2. Asam',-2,0)+L('h','pH 3–4',1.5,.5),
 stage:`<div class="abs fade" style="left:40px;top:150px;width:640px;--d:.5s"><div style="height:60px;border:4px solid #3a2312;background:linear-gradient(90deg,#e2552d,#f4d03f 30%,#6fb04a 50%,#2a7f86 75%,#2e4fa0)"></div>
 <div style="display:flex;justify-content:space-between;font-weight:900;font-size:24px;margin-top:6px"><span>0 asam</span><span>7</span><span>14 basa</span></div></div>
 <div class="abs pin" style="left:30px;top:70px"><div class="tag" style="background:#f0a500;position:relative">MADU ▼</div></div>
 <div class="abs pop" style="left:70px;top:300px;--d:3s">${lemon()}</div><div class="tag pop" style="left:220px;top:340px;--d:3.5s;--r:2deg">≈ jus jeruk</div>`,css:`
 .pin{animation:pin 2.6s cubic-bezier(.3,1.3,.4,1) 1s both}@keyframes pin{from{transform:translateX(280px)}to{transform:translateX(0)}}`},
{d:10,vo:'Kebanyakan bakteri nggak betah di lingkungan seasam itu. Dan sekarang bagian paling gila.',head:L('c','Bakteri nggak betah',-1.5,0),

 <div class="abs shake" style="left:230px;top:210px">${bact('#2a7f86',240)}</div><div class="abs pop" style="left:290px;top:220px;--d:2.5s">${x()}</div>
 <div class="abs pop bob" style="left:150px;top:60px;--d:6.2s;--r:4deg"><span class="lab p" style="font-size:46px;animation:none">Bagian paling gila!</span></div>`},
{d:8,vo:'Lebah menambahkan enzim ke nektar. Selama madu pekat, enzim ini diam.',head:L('p','3. Enzim lebah',-2,0),

 <div class="tag pop" style="left:400px;top:480px;--d:4.6s;--r:-2deg;background:#e9dcff">enzim (diam)</div>`,css:`

{d:9,vo:'Begitu madu sedikit tercampur air, enzim menghasilkan hidrogen peroksida, antiseptik yang membunuh kuman.',head:L('p','Enzim bangun!',-2,0),

 <div class="abs dropin" style="left:330px;top:0">${drop(60)}</div>
 <div class="abs b1" style="left:260px;top:360px"><div class="tag" style="background:#d9f3d0">H₂O₂</div></div><div class="abs b2" style="left:420px;top:380px"><div class="tag" style="background:#d9f3d0">H₂O₂</div></div>

{d:10,vo:'Jadi madu bukan cuma manis. Kering buat kuman, asam buat kuman, antiseptik buat kuman.',head:L('h','Kering',-2,0)+L('k','+ Asam',1.5,.5)+L('p','+ Antiseptik',-1,1),

{d:8,vo:'Tiga lapis pertahanan dalam satu sendok.',head:L('k','3 lapis',-2,0)+L('h','1 sendok',1.5,.6),
