<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>Kok Bisa? #01 v2 – Bakteri vs Madu</title>
<style>
:root{--paper:#f3e9d2;--ink:#3a2312;--honey:#f0a500;--honey2:#c77d00;--teal:#2a7f86;--coral:#e2552d;--lemon:#f4d03f;--plum:#6b3fa0;--water:#6fb7e9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:var(--paper)}
body{font-family:'Inter','Liberation Sans',sans-serif;color:var(--ink);position:relative}
/* kertas: grain + halftone */
#bg{position:absolute;inset:0;background:
 radial-gradient(circle at 1px 1px,#3a231214 1.2px,transparent 1.6px) 0 0/14px 14px,var(--paper)}
#grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.scene{position:absolute;inset:0;display:none}
.sh{filter:drop-shadow(3px 5px 0 rgba(58,35,18,.22))}
/* kepala */
.badge{position:absolute;top:100px;left:50%;background:var(--ink);color:var(--paper);font-weight:900;font-size:26px;padding:8px 18px;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;z-index:20;letter-spacing:.5px}
.tape{position:absolute;width:90px;height:28px;background:#e8d8a888;transform:rotate(-8deg)}
.hl{position:absolute;top:176px;left:60px;right:60px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10}
.lab{display:inline-block;font-weight:900;font-size:56px;line-height:1.04;padding:8px 22px 10px;text-transform:uppercase;letter-spacing:-1px;
 clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 94%,96% 100%,2% 96%,0 100%);animation:labin .5s cubic-bezier(.2,1.5,.4,1) both}
.lab.h{background:var(--honey);color:var(--ink)}.lab.k{background:var(--ink);color:var(--paper)}.lab.c{background:var(--coral);color:var(--paper)}.lab.t{background:var(--teal);color:var(--paper)}.lab.p{background:var(--plum);color:var(--paper)}
.lab.s{font-size:42px}
@keyframes labin{from{transform:translateY(-60px) scale(.6) rotate(var(--r,-2deg));opacity:0}60%{opacity:1}to{transform:rotate(var(--r,-2deg))}}
/* panggung */
.stage{position:absolute;left:0;top:410px;width:720px;height:580px;transform:scale(.86);transform-origin:50% 0}
.abs{position:absolute}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(var(--r,0deg))}}
.fade{animation:fade .5s ease var(--d,0s) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slam{animation:slam .45s cubic-bezier(.2,1.2,.3,1) var(--d,0s) both}
@keyframes slam{from{transform:translateY(-500px) rotate(-8deg)}70%{transform:translateY(8px) rotate(1deg)}to{transform:translateY(0) rotate(var(--r,0deg))}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.shake{animation:shake .35s linear infinite}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-5px 2px}75%{translate:5px -2px}}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{position:absolute;background:var(--paper);border:3px solid var(--ink);font-weight:800;font-size:26px;padding:6px 14px;box-shadow:4px 5px 0 var(--ink)}
/* subtitle */
.sub{position:absolute;left:60px;right:60px;top:888px;height:186px;background:#fbf5e6;transform:rotate(-.8deg);
 box-shadow:5px 7px 0 rgba(58,35,18,.28);clip-path:polygon(0 3%,4% 0,50% 2%,96% 0,100% 3%,99% 97%,60% 100%,10% 98%,0 100%);z-index:30;
 font-weight:800;font-size:36px;line-height:1.28}
.ck{position:absolute;left:24px;right:24px;top:18px;display:flex;flex-wrap:wrap;justify-content:center;text-align:center;gap:0 9px;opacity:0;animation:ckin .01s linear var(--cs) both,ckout .01s linear var(--ce) forwards}
@keyframes ckin{to{opacity:1}}@keyframes ckout{to{opacity:0}}
.sub span{color:rgba(58,35,18,.28);animation:w .01s linear var(--wd) both}
@keyframes w{to{color:#3a2312}}
.sub:before{content:"";position:absolute;top:-6px;left:40%;width:90px;height:24px;background:#e8d8a8aa;transform:rotate(3deg)}
/* progres */
#prog{position:absolute;left:0;bottom:0;height:16px;background:var(--ink);z-index:40}
#time{position:absolute;left:34px;bottom:34px;font-weight:800;font-size:22px;color:#3a231299;z-index:40}
#mark{position:absolute;right:34px;bottom:34px;font-weight:800;font-size:22px;color:#3a231299;z-index:40}
</style></head><body>
<div id="bg"></div>
<svg id="grain" width="720" height="1280"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .9 0"/></filter><rect width="720" height="1280" filter="url(#n)"/></svg>
<div class="badge sh">FAKTA UNIK</div>
<div id="root"></div>
<div id="time">0:00</div><div id="mark">KOLASE – VERSI GRATIS</div><div id="prog"></div>

<style>
.shr{animation:shr 5s ease 2s both}@keyframes shr{to{transform:scale(.55) translateY(40px);filter:grayscale(1) sepia(.4)}}
.flow{animation:flow 1.5s ease-in var(--d) both}@keyframes flow{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(200px,200px) scale(.4)}}
</style>
<script src="timing-ep01-v2.js" onerror=""></script>

<circle cx="104" cy="46" r="0" fill="#fff"/></g></svg>`;

const bubble=(t)=>`<div class="tag" style="background:#d9f3d0">${t}</div>`;
const score=(a,b)=>`BAKTERI ${a} – ${b} MADU`;
const S=[
{d:4.5,vo:'Bakteri melawan madu. Tiga ronde. Dan bakteri kalah telak.',head:L('t','Bakteri',-2,0)+L('h','VS Madu',1.5,.5),
 stage:`<div class="abs slam" style="left:24px;top:150px;--d:.2s"><div class="bob">${bact('#2a7f86',260)}</div></div>
 <div class="abs slam" style="left:446px;top:40px;--d:.5s;--r:3deg"><div class="bob" style="animation-delay:-1s">${jar2(250)}</div></div>

{d:13,vo:'Ribuan tahun lalu, orang Mesir kuno menyimpan madu di makam. Para arkeolog kemudian menemukannya, dan madunya dilaporkan masih terlihat utuh. Rahasianya bukan bahan pengawet. Tapi tiga ronde yang selalu dimenangkan madu.',head:L('k','Makam kuno',-2,0),

{d:15,vo:'Ronde satu: kekeringan. Bakteri butuh air untuk hidup. Tapi madu hampir semuanya gula, dan airnya cuma sekitar seperlima. Gula yang sangat pekat itu menarik air keluar dari tubuh bakteri. Bakteri pun mengerut dan kering. Satu nol untuk madu.',head:L('t','Ronde 1',-2,0)+L('h','Kering',1.5,.5),
 stage:`<div class="abs shr" style="left:30px;top:200px;animation-delay:6s">${bact('#2a7f86',220)}</div>
 <div class="abs fade" style="left:340px;top:150px;--d:2.5s"><div style="display:grid;grid-template-columns:repeat(3,90px);gap:12px">${[0,1,2,3,4,5].map(()=>cube()).join('')}</div></div>
 <div class="abs flow" style="left:230px;top:230px;--d:7s">${drop(44)}</div><div class="abs flow" style="left:220px;top:240px;--d:8.3s">${drop(44)}</div><div class="abs flow" style="left:240px;top:225px;--d:9.6s">${drop(44)}</div><div class="abs flow" style="left:225px;top:235px;--d:10.9s">${drop(44)}</div>
 <div class="tag pop" style="left:80px;top:90px;--d:3.5s;--r:-2deg">bakteri butuh AIR</div>
 <div class="tag pop" style="left:340px;top:372px;--d:5s;--r:2deg;background:#fff3c4">gula pekat menarik air</div>
 <div class="tag pop" style="left:170px;top:466px;--d:13s;--r:-2deg;background:#fff">${score(0,1)}</div>`},
{d:10,vo:'Ronde dua: keasaman. pH madu sekitar tiga sampai empat, hampir sama dengan jus jeruk. Kebanyakan bakteri nggak tahan hidup di lingkungan seasam itu. Dua nol.',head:L('c','Ronde 2',-2,0)+L('h','Asam',1.5,.5),

{d:16,vo:'Ronde tiga, dan ini pukulan telaknya. Lebah menambahkan enzim ke nektar. Enzim ini diam selama madu pekat. Tapi begitu madu terkena sedikit air, enzimnya bangun dan menghasilkan hidrogen peroksida, zat antiseptik yang membunuh kuman. Bakteri yang masih bertahan? Habis. Tiga nol.',head:L('p','Ronde 3',-2,0)+L('k','Enzim',1.5,.5),

 <div class="tag tmp" style="left:440px;top:200px;--d:5s;--r:3deg;background:#e9dcff">enzim (diam)</div>
 <div class="abs pop" style="left:450px;top:230px;--d:7.5s;font-size:90px;font-weight:900;color:#e2552d">!</div>
 <div class="abs b1" style="left:240px;top:340px">${bubble('H₂O₂')}</div><div class="abs b2" style="left:400px;top:360px">${bubble('H₂O₂')}</div><div class="abs b3" style="left:320px;top:380px">${bubble('H₂O₂')}</div>
 <div class="abs die" style="left:240px;top:470px">${bact('#2a7f86',130)}</div><div class="abs die" style="left:520px;top:490px;animation-delay:10.8s">${bact('#2a7f86',110)}</div>

 .b1{animation:rise 3.4s ease-out 8s both}.b2{animation:rise 3.4s ease-out 8.8s both}.b3{animation:rise 3.4s ease-out 9.6s both}@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.5)}30%{opacity:1}to{opacity:0;transform:translateY(-140px) scale(1.1)}}

function wordTimes(words,a,b){
 let segs=[],cur=a;
 if(C){(C.sil).forEach(([s,e])=>{if(e<=a||s>=b)return;if(s>cur)segs.push([cur,Math.min(s,b)]);cur=Math.max(cur,e);});if(cur<b)segs.push([cur,b]);}
