.abs{position:absolute}
.lab{white-space:nowrap;position:absolute;font-weight:900;text-transform:uppercase;letter-spacing:-3px;line-height:1;padding:14px 44px 22px;clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 94%,96% 100%,2% 96%,0 100%)}
.tag{position:absolute;background:var(--paper);border:6px solid var(--ink);font-weight:900;padding:12px 30px;box-shadow:9px 11px 0 var(--ink)}
</style>
