<!doctype html><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}
:root{--paper:#f3e9d2;--ink:#3a2312;--honey:#f0a500;--teal:#2a7f86;--coral:#e2552d}
body{width:1080px;height:1920px;background:var(--paper);position:relative;overflow:hidden;font-family:'Inter',sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,#3a231216 2.2px,transparent 2.8px) 0 0/28px 28px}
.sh{filter:drop-shadow(8px 12px 0 rgba(58,35,18,.24))}
.abs{position:absolute}
.row{position:absolute;left:0;width:1080px;text-align:center}
.lab{display:inline-block;white-space:nowrap;font-weight:900;text-transform:uppercase;letter-spacing:-3px;line-height:1;padding:14px 48px 24px;clip-path:polygon(0 6%,3% 0,97% 4%,100% 0,99% 94%,96% 100%,2% 96%,0 100%)}
.tag{display:inline-block;background:var(--paper);border:6px solid var(--ink);font-weight:900;padding:14px 38px;box-shadow:9px 11px 0 var(--ink);white-space:nowrap}
</style>
